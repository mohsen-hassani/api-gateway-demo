apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

# Images are named envoy-demo-<service>. `make k8s-apply` sets registry and tag on top of
# this overlay; applying it directly uses the local image names as they are.
patches:
  - target:
      kind: Deployment
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
