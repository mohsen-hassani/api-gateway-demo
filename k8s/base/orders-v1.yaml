apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orders
      version: v1
  template:
    metadata:
      labels:
        app: orders
        version: v1
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: orders-v1
          image: envoy-demo-orders
          ports:
            - containerPort: 8003
          env:
            - name: APP_VERSION
              value: "v1"
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8003
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8003
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: orders-v1
spec:
  type: ClusterIP
  selector:
    app: orders
    version: v1
  ports:
    - port: 8003
      targetPort: 8003
