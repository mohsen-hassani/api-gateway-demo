apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
spec:
  replicas: 1
  # users live in memory: never run two auth-service pods at once, not even during a rollout
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: auth-service
          image: envoy-demo-auth
          ports:
            - containerPort: 8006
          env:
            - name: JWT_PRIVATE_KEY_PATH
              value: "/keys/jwt-private.pem"
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8006
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8006
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: jwt-key
              mountPath: /keys
              readOnly: true
      volumes:
        - name: jwt-key
          secret:
            secretName: auth-jwt-key
            defaultMode: 0444
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
spec:
  type: ClusterIP
  selector:
    app: auth
  ports:
    - port: 8006
      targetPort: 8006
